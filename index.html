    body {

      direction: rtl;
    }
    h1, h2, h3 {

    }

      padding: 10px;
      margin: 5px 0;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid #ccc;

    }

    }
    .btn {
      background-color: #27ae60;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #1e8449;
    }
    .btn-danger {
      background-color: #c0392b;
    }
    .btn-danger:hover {
      background-color: #922b21;
    }
    .red {
      color: red;
    }
    .hidden {
      display: none;
    }
    #report {
     margin: 20px auto;

   }

     font-size: 20px;

    .red-balance {
